listen: 127.0.0.1:4222

# Monitoring endpoint (localhost only) — serves /healthz, /varz, /jsz and
# /stacksz (full goroutine dump) independently of JetStream store locks, so
# a wedged stream can be diagnosed without killing the process (DEV-2142).
http: 127.0.0.1:8222

jetstream {
        max_mem: 1G
        max_file: 12G
        sync_interval: 60s
}

mappings {
        "raw.>": "rawmem.>"
}
